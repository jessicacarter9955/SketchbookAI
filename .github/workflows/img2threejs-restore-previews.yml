name: Restore verified photorealistic reference previews
on:
  push:
    branches: [img2threejs-runner]
    paths: [".github/workflows/img2threejs-restore-previews.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve screenshots from successful 5/5 WebGL test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38598387619 --repo jessicacarter9955/SketchbookAI -n img2threejs-original-run -D /tmp/img2three-run
          find /tmp/img2three-run -maxdepth 3 -type f | head -30
          mkdir -p img2three/preview
          cp -v /tmp/img2three-run/preview/* img2three/preview/
          test -f img2three/preview/gallery-report.json
          test -f img2three/preview/tree-front.png
          test -f img2three/preview/compact-front.png
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img2three/preview
          git commit -m "gallery: publish 10 tested 3D view screenshots" || exit 0
          git pull --rebase
          git push
