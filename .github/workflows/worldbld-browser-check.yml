name: WorldBLD + Lightning (read-only browser check)

on:
  push:
    branches: [img2threejs-runner]
    paths:
      - ".github/workflows/worldbld-browser-check.yml"
      - "tools/worldbld-browser/probe.cjs"
      - "tools/worldbld-browser/validate-block.cjs"
      - "tools/worldbld-browser/generate-osm.cjs"
      - "tools/worldbld-browser/city-block-plan.json"
      - "tools/worldbld-browser/lightning_runner.py"
      - "tools/worldbld-browser/WorldBLD_Prototype/**"
  workflow_dispatch:

concurrency:
  group: worldbld-public-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inspect-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Playwright browser
        run: |
          cd tools/worldbld-browser
          npm init -y
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Validate WorldBLD block design without Unreal or GPU
        run: |
          node tools/worldbld-browser/validate-block.cjs
          node tools/worldbld-browser/generate-osm.cjs tools/worldbld-browser/results/worldbld-city-block.osm
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("tools/worldbld-browser/results/worldbld-city-block.osm").getroot()
          ways = root.findall("way")
          roads = [w for w in ways if any(t.attrib.get("k")=="highway" for t in w.findall("tag"))]
          buildings = [w for w in ways if any(t.attrib.get("k")=="building" for t in w.findall("tag"))]
          assert len(roads) == 4 and len(buildings) == 10, (len(roads), len(buildings))
          assert all(len(w.findall("nd")) == 5 for w in buildings)
          print("Native StreetMap XML parsed: 4 road ways and 10 building footprints. Unreal import still untested.")
          PY
          python -m py_compile tools/worldbld-browser/lightning_runner.py
          python -m py_compile tools/worldbld-browser/WorldBLD_Prototype/Scripts/import_city_block_into_unreal.py
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("tools/worldbld-browser/WorldBLD_Prototype/WorldBLD_Prototype.uproject")
          project=json.loads(path.read_text())
          enabled={p["Name"] for p in project["Plugins"] if p["Enabled"]}
          assert {"WorldBLD","RoadBLD","CityBLD","StreetMap","PythonScriptPlugin"} <= enabled
          assert project["EngineAssociation"]=="5.8"
          print("Native Unreal project and StreetMap import automation passed static validation (not executed in Unreal).")
          PY
          python tools/worldbld-browser/lightning_runner.py
      - name: Inspect Lightning and WorldBLD without authentication or GPU
        run: node tools/worldbld-browser/probe.cjs
      - name: Upload screenshot and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbld-lightning-readonly-probe
          path: tools/worldbld-browser/results/
          if-no-files-found: warn
          retention-days: 7
