name: TruthLab — autonomous public Ari and Noor
on:
  schedule:
    - cron: '7 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/truthlab-github-public.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: truthlab-public-journal
  cancel-in-progress: false
jobs:
  qwen-public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-1.5b-q4km-sha6a1a2eb6
      - name: Start REAL pinned local Qwen CPU model
        run: bash truthlab-live/start-local-llama.sh
      - name: Research external sources and publish authentic Ari+Noor GitHub journal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: http://127.0.0.1:8080/v1
          OPENAI_MODEL: qwen-local
          OPENAI_API_KEY: local-secretless-inference
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          python -u truthlab-live/github_public_agent.py
      - name: Summary and public channel link
        if: always()
        run: |
          echo "Public journal: https://github.com/jessicacarter9955/SketchbookAI/issues/4" >> "$GITHUB_STEP_SUMMARY"
          echo "Only a confirmed GitHub Issue comment is a published post." >> "$GITHUB_STEP_SUMMARY"
