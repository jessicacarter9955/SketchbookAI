# Continue a *verified* fictional 100-turn artifact to 500 with genuine local
# Qwen inference.  All writes use disposable CI PostgreSQL; no production data.
name: TruthLab Backrooms 100 to 500

on:
  push:
    branches: [main]
    paths: ['.github/workflows/truthlab-backrooms-500.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: truthlab-backrooms-500
  cancel-in-progress: false

jobs:
  continue-to-500:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: truthlab_500_ci
          POSTGRES_USER: truthlab
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U truthlab -d truthlab_500_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRUTHLAB_DATABASE_URL: postgresql://truthlab:disposable_ci_only@127.0.0.1:5432/truthlab_500_ci?sslmode=disable
      TRUTHLAB_TEST_DATABASE_URL: postgresql://truthlab:disposable_ci_only@127.0.0.1:5432/truthlab_500_ci?sslmode=disable
      TRUTHLAB_CI_CONTINUATION: '1'
      TRUTHLAB_CI_SEED: truthlab-ci-seed
      TRUTHLAB_CI_OUTPUT: truthlab-500-output
      TRUTHLAB_BACKROOMS_MAX_TOKENS: '170'
      OPENAI_MODEL: qwen-local
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
      OPENAI_API_KEY: local-only-no-external-key
    steps:
      - name: Checkout isolated TruthLab code
        uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install -r truthlab-live/requirements.txt
      - name: Recover the verified 100-turn seed from October 18
        uses: actions/download-artifact@v4
        with:
          name: backrooms-100-transcript
          run-id: 39148303221
          github-token: ${{ github.token }}
          repository: jessicacarter9955/SketchbookAI
          path: truthlab-ci-seed
      - name: Cache Qwen 1.5B weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-1.5b-q4km-sha6a1a2eb6
      - name: Start local inference server
        run: bash truthlab-live/start-local-llama.sh
      - name: Continue Ari and Noor from turn 101 through 500
        run: python -u truthlab-live/continue_backrooms_ci.py
      - name: Save transcript and checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthlab-backrooms-500-continuation
          path: truthlab-500-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Assert 500 real model turns and restored memory
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('truthlab-500-output/summary.json')
          if not path.is_file():
              raise SystemExit('No verified 500-turn summary; check preceding step and checkpoint artifact')
          data = json.loads(path.read_text())
          assert data['verified'] and data['complete'], data
          assert (data['verified_turns'], data['restored_source_turns'],
                  data['new_real_turns'], data['memory_count'],
                  data['archived_sessions']) == (500, 100, 400, 500, 125), data
          print('TRUTHLAB500_CI_CONFIRMED: original 100 + 400 new turns, 500 memories, 125 archives')
          PY
