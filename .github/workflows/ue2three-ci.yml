name: UE2Three migration tests

on:
  push:
    branches:
      - chatgpt/ue2three-dds
  pull_request:
    paths:
      - 'tools/ue2three/**'
      - 'src/editor/ue2three-**'
      - 'tests/ue2three-**'
      - '.github/workflows/ue2three-ci.yml'

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline migration unit tests
        run: python -m unittest discover -s tools/ue2three/tests -q
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Three.js / editor regression tests
        run: npm test
      - name: Build editor and player
        run: npm run build
