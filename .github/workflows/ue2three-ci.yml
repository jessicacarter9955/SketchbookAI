name: UE2Three migration tests

on:
  push:
    branches:
      - chatgpt/ue2three-dds
  pull_request:
    paths:
      - 'tools/ue2three/**'
      - 'src/editor/ue2three-**'
      - 'tests/ue2three-**'
      - '.github/workflows/ue2three-ci.yml'

permissions:
  contents: read

# Independent source-free checks run concurrently. Unreal assets remain local.
# Keep the original "migration" check name as an all-green final gate.
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry diagnostic test dependency
        run: python -m pip install trimesh==4.12.2
      - name: Offline migration and workspace regression tests
        run: python -m unittest discover -s tools/ue2three/tests -q

  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Three.js source/runtime regression tests
        run: npm test

  editor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build editor and player
        run: npm run build

  migration:
    runs-on: ubuntu-latest
    needs: [python-tests, js-tests, editor-build]
    if: always()
    steps:
      - name: Require every independent migration check to pass
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          JS_RESULT: ${{ needs.js-tests.result }}
          BUILD_RESULT: ${{ needs.editor-build.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$JS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
