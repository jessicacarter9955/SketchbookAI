name: TruthLab Backrooms 100-turn batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/truthlab-batch-100.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: truthlab_100
          POSTGRES_USER: truthlab
          POSTGRES_PASSWORD: disposable_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U truthlab -d truthlab_100"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRUTHLAB_DATABASE_URL: postgresql://truthlab:disposable_ci@127.0.0.1:5432/truthlab_100?sslmode=disable
      TRUTHLAB_TEST_DATABASE_URL: postgresql://truthlab:disposable_ci@127.0.0.1:5432/truthlab_100?sslmode=disable
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
      OPENAI_API_KEY: local-only-no-external-key
      OPENAI_MODEL: qwen-local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r truthlab-live/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-1.5b-q4km-sha6a1a2eb6
      - run: bash truthlab-live/start-local-llama.sh
      - run: python -u truthlab-live/run_100_backrooms.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backrooms-100-transcript
          path: truthlab-live/batch100-output/
          retention-days: 30
          if-no-files-found: warn