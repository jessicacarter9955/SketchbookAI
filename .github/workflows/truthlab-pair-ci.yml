name: TruthLab Pair CI
on:
  push:
    branches:
      - truthlab-autonomous-agents
    paths:
      - 'truthlab-live/**'
      - '.github/workflows/truthlab-pair-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truthlab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: truthlab_test
          POSTGRES_USER: truthlab
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truthlab -d truthlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r truthlab-live/requirements.txt
      - name: Python syntax
        run: python -m compileall -q truthlab-live
      - name: Test agent controls and authorization
        run: python -m unittest discover -s truthlab-live -p 'test_*.py' -v
      - name: Real PostgreSQL persistence integration
        env:
          TRUTHLAB_TEST_DATABASE_URL: postgresql://truthlab:test_only_password@127.0.0.1:5432/truthlab_test?sslmode=disable
        run: python -m unittest discover -s truthlab-live -p 'test_postgres_integration.py' -v
      - name: Validate frontend JavaScript syntax
        run: |
          node --check truthlab-live/browser-control.js
          node --check truthlab-live/browser-worker.js
