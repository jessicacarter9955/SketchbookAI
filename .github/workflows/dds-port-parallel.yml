name: DDS parallel - 18 porting workpacks
on:
  push:
    branches:
      - codex/dds-parallel-manual-first
    paths:
      - '.github/workflows/dds-port-parallel.yml'
      - 'tools/ue2three/dds_parallel_prepare.py'
      - 'tools/ue2three/dds_porting_lanes.json'
      - 'tools/ue2three/**'
      - 'src/editor/**'
      - 'docs/ue2three-progress.md'
      - 'dds-manual-playtest.html'
      - 'dds-parallel-status.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-readiness:
    name: DDS · unattended capabilities (no secrets exposed)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      HAVE_NETLIFY_SECRET: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
      HAVE_OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY != '' }}
    steps:
      - name: Verify availability only (no API calls or costs)
        shell: bash
        run: |
          echo "Netlify secure secret available: $HAVE_NETLIFY_SECRET" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenCode provider key available: $HAVE_OPENCODE_KEY (not invoked or billed)" >> "$GITHUB_STEP_SUMMARY"
          echo "No automated Unreal export inferred from key availability." >> "$GITHUB_STEP_SUMMARY"
  source-and-code:
    name: DDS · ${{ matrix.lane }}
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        lane:
          - tool-verifier
          - source-assets
          - character-weapons
          - animation-rig
          - blueprint-compiler
          - inventory-economy
          - maps-collision
          - materials-pbr
          - umg-ui
          - shop-dialogues
          - movement-input
          - physics
          - vfx-audio
          - multiplayer
          - metahuman
          - lighting
          - integrated-play
          - performance-streaming
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare original-source engineering packet (not a gameplay test)
        run: python tools/ue2three/dds_parallel_prepare.py --lane "${{ matrix.lane }}"
      - name: Archive independent lane deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workpack-${{ matrix.lane }}
          path: |
            build/dds-port-workpacks/${{ matrix.lane }}.json
            build/dds-port-workpacks/${{ matrix.lane }}.md
          if-no-files-found: warn
          retention-days: 14
      - name: Explain accuracy boundaries
        if: always()
        run: |
          echo "## DDS · ${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent preparation only; no original Unreal export, UI Play, 1:1 proof or multiplayer claimed." >> "$GITHUB_STEP_SUMMARY"
          if test -f "build/dds-port-workpacks/${{ matrix.lane }}.md"; then
            cat "build/dds-port-workpacks/${{ matrix.lane }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  offline-extractor-regression:
    name: DDS · actual offline UE2Three regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual UE2Three Python unit tests (no original packages required)
        env:
          PYTHONPATH: tools/ue2three
        run: python -m unittest discover -s tools/ue2three/tests -p 'test_*.py' -v
