name: DDS Blueprint runtime regression
on:
  push:
    branches:
      - codex/dds-parallel-manual-first
    paths:
      - 'src/editor/ue2three-blueprint-runtime.mjs'
      - 'src/editor/Ue2ThreeGameplay.js'
      - 'tests/ue2three-blueprint-runtime.test.mjs'
      - '.github/workflows/dds-blueprint-runtime-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blueprint-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute actual translated Blueprint and delegate regressions
        run: node --test tests/ue2three-blueprint-runtime.test.mjs tests/ue2three-blueprint.test.mjs tests/ue2three-effects.test.mjs
