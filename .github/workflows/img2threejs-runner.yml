name: img2threejs original pipeline
on:
  push:
    branches: [img2threejs-runner]
    paths:
      - ".github/workflows/img2threejs-runner.yml"
      - "img2three/input/**"
      - "img2three/*.base64"
      - "img2three/tower-spec.json"
      - "img2three/viewer/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-skill-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated working branch
        uses: actions/checkout@v4
      - name: Checkout original img2threejs
        uses: actions/checkout@v4
        with:
          repository: img2threejs/img2threejs
          ref: main
          path: img2three-source
      - name: Verify core original tools
        run: |
          cd img2three-source
          python3 --version
          test -f SKILL.md
          test -f forge/stage1_intake/probe_image.py
          test -f forge/stage2_spec/new_pre_spec_assessment.py
          test -f forge/stage2_spec/new_sculpt_spec.py
          test -f forge/stage2_spec/validate_sculpt_spec.py
          test -f forge/stage3_build/generate_threejs_factory.py
      - name: Decode real user reference
        run: |
          mkdir -p img2three/output
          base64 -d img2three/reference_tower.jpg.base64 > img2three/reference_tower.jpg
          file img2three/reference_tower.jpg
      - name: Run original image probe and assessment
        run: |
          set -o pipefail
          cd img2three-source
          python3 forge/stage1_intake/probe_image.py ../img2three/reference_tower.jpg > ../img2three/output/image-probe.json
          python3 forge/stage2_spec/new_pre_spec_assessment.py "Twisting Glass Skyscraper" --image ../img2three/reference_tower.jpg --complexity complex --out ../img2three/output/assessment.json --force
          cp ../img2three/tower-spec.json ../img2three/output/object-sculpt-spec.json
          python3 forge/stage2_spec/validate_sculpt_spec.py ../img2three/output/object-sculpt-spec.json --strict-quality --json > ../img2three/output/strict-validation.json || true
          python3 forge/stage3_build/generate_threejs_factory.py ../img2three/output/object-sculpt-spec.json --force --out ../img2three/output/createTowerModel.ts --blocked-report ../img2three/output/generator-blocked.json > ../img2three/output/generator-log.txt 2>&1 || true
          echo "Original img2threejs scripts executed against author-reviewed 51-component skyscraper specification." >> "$GITHUB_STEP_SUMMARY"
          cat ../img2three/output/generator-log.txt | tail -25
      - name: Build Three.js viewer against generated original source
        run: |
          mkdir -p img2three/viewer/src/generated
          cp img2three/output/createTowerModel.ts img2three/viewer/src/generated/createTowerModel.ts
          npm --prefix img2three/viewer install --no-audit --no-fund
          npm --prefix img2three/viewer run build
          test -f img2three/viewer/dist/index.html
          echo "Vite compiled imported Three.js factory successfully." >> "$GITHUB_STEP_SUMMARY"
      - name: Automated WebGL preview screenshots for all five 3D models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img2three/preview /tmp/webgl-test
          npm --prefix /tmp/webgl-test install --no-audit --no-fund playwright
          node /tmp/webgl-test/node_modules/playwright/cli.js install --with-deps chromium
          npm --prefix img2three/viewer run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ -o /dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('/tmp/webgl-test/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1180,height:850},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction('window.__threeReady===true || !!window.__threeError',null,{timeout:60000});
            const report=[];
            for (const id of ['tower','compact','purple','rifle','tree']) {
              if(id!=='tower')await page.evaluate(id=>window.__chooseAsset(id),id);
              await page.waitForFunction(id=>window.__activeModel===id && window.__firstRenderComplete===true,id,{timeout:60000});
              await page.waitForTimeout(id==='tree'?1100:600);
              const v=await page.evaluate(()=>({ready:window.__threeReady,error:window.__threeError,stats:window.__threeStats}));
              await page.evaluate(()=>{document.querySelector('.ui').style.visibility='hidden';document.querySelector('.bottomhint').style.visibility='hidden'});
              await page.screenshot({path:'img2three/preview/'+id+'-front.png',timeout:90000});
              await page.evaluate(()=>window.__setPreviewView('angle'));
              await page.waitForTimeout(350);
              await page.screenshot({path:'img2three/preview/'+id+'-threequarter.png',timeout:90000});
              await page.evaluate(()=>{window.__setPreviewView('front');document.querySelector('.ui').style.visibility='visible';document.querySelector('.bottomhint').style.visibility='visible'});
              report.push({id,...v});
              console.log(JSON.stringify({id,stats:v.stats,error:v.error}));
              if(!v.ready || v.error)throw Error('Model '+id+' failed to render: '+v.error);
            }
            if(errors.length)throw Error('Browser exceptions: '+errors.join('; '));
            await browser.close();
            require('fs').writeFileSync('img2three/preview/gallery-report.json',JSON.stringify(report,null,2));
            console.log('PASS: WebGL 5/5; 10 screenshots captured');
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Upload input and pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img2threejs-original-run
          path: |
            img2three/output/
            img2three/reference_tower.jpg
            img2three/preview/
          if-no-files-found: warn
      # Generated factory output remains in the repository; the separate gallery
      # workflow publishes the bundle. This job validates WebGL and uploads
      # screenshots as artifacts, preventing duplicate concurrent Git pushes.
