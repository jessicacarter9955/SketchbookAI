name: img2threejs original pipeline
on:
  push:
    branches: [img2threejs-runner]
    paths:
      - ".github/workflows/img2threejs-runner.yml"
      - "img2three/input/**"
      - "img2three/rifle-superprompt.md"
      - "img2three/rifle-view-contract.json"
      - "img2three/author_lime_rifle_spec.py"
      - "img2three/*.base64"
      - "img2three/tower-spec.json"
      - "img2three/viewer/**"
  workflow_dispatch:

concurrency:
  group: img2threejs-original-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  original-skill-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated working branch
        uses: actions/checkout@v4
      - name: Checkout original img2threejs
        uses: actions/checkout@v4
        with:
          repository: img2threejs/img2threejs
          ref: main
          path: img2three-source
      - name: Verify core original tools
        run: |
          cd img2three-source
          python3 --version
          test -f SKILL.md
          test -f forge/stage1_intake/probe_image.py
          test -f forge/stage2_spec/new_pre_spec_assessment.py
          test -f forge/stage2_spec/new_sculpt_spec.py
          test -f forge/stage2_spec/validate_sculpt_spec.py
          test -f forge/stage3_build/generate_threejs_factory.py
      - name: Decode real user reference
        run: |
          mkdir -p img2three/output
          base64 -d img2three/reference_tower.jpg.base64 > img2three/reference_tower.jpg
          file img2three/reference_tower.jpg
      - name: Run original image probe and assessment
        run: |
          set -o pipefail
          cd img2three-source
          python3 forge/stage1_intake/probe_image.py ../img2three/reference_tower.jpg > ../img2three/output/image-probe.json
          python3 forge/stage2_spec/new_pre_spec_assessment.py "Twisting Glass Skyscraper" --image ../img2three/reference_tower.jpg --complexity complex --out ../img2three/output/assessment.json --force
          cp ../img2three/tower-spec.json ../img2three/output/object-sculpt-spec.json
          python3 forge/stage2_spec/validate_sculpt_spec.py ../img2three/output/object-sculpt-spec.json --strict-quality --json > ../img2three/output/strict-validation.json || true
          python3 forge/stage3_build/generate_threejs_factory.py ../img2three/output/object-sculpt-spec.json --force --out ../img2three/output/createTowerModel.ts --blocked-report ../img2three/output/generator-blocked.json > ../img2three/output/generator-log.txt 2>&1 || true
          echo "Original img2threejs scripts executed against author-reviewed 51-component skyscraper specification." >> "$GITHUB_STEP_SUMMARY"
          cat ../img2three/output/generator-log.txt | tail -25
      - name: Run original img2threejs rifle spec pipeline and enforce quality gates
        shell: bash
        run: |
          set -euo pipefail
          test -s img2three/rifle-superprompt.md
          test -s img2three/viewer/public/ref/rifle.webp
          test -s img2three/rifle-view-contract.json
          test -s img2three/input/lime-rifle-auxiliary-views.json
          # The true original is never replaced: unpack six AI-generated support views.
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          package=json.loads(Path('img2three/input/lime-rifle-auxiliary-views.json').read_text())
          assert len(package['views']) == 6
          for view in package['views']:
              payload=base64.b64decode(''.join(view['encodedWebpChunks']))
              assert hashlib.sha256(payload).hexdigest()==view['sha256']
              out=Path('img2three/input')/('rifle-aux-'+view['id']+'.webp')
              out.write_bytes(payload)
              print('decoded supporting reference',view['id'],out,len(payload))
          PY
          mkdir -p img2three/output
          cp img2three/rifle-superprompt.md img2three/output/rifle-superprompt-applied.md
          cp img2three/rifle-view-contract.json img2three/output/rifle-view-contract.json
          cd img2three-source
          # Execute upstream Forge scripts, rather than pretending a scene image is 3D.
          python3 forge/stage1_intake/probe_image.py ../img2three/viewer/public/ref/rifle.webp > ../img2three/output/rifle-image-probe.json
          for angle in left muzzle right brace top bottom; do
            python3 forge/stage1_intake/probe_image.py "../img2three/input/rifle-aux-${angle}.webp" \
              > "../img2three/output/rifle-aux-${angle}-probe.json"
          done
          python3 forge/stage2_spec/new_pre_spec_assessment.py "Lime Green Reference Carbine" \
            --image ../img2three/viewer/public/ref/rifle.webp \
            --complexity ultra-complex \
            --spec-query "$(sed -n '4,9p' ../img2three/rifle-superprompt.md | tr '\n' ' ' | cut -c1-280)" \
            --out ../img2three/output/rifle-pre-spec-assessment.json --force
          python3 forge/stage2_spec/new_sculpt_spec.py "Lime Green Reference Carbine" \
            --image ../img2three/viewer/public/ref/rifle.webp \
            --assessment ../img2three/output/rifle-pre-spec-assessment.json \
            --out ../img2three/output/rifle-object-sculpt-spec.json --force
          # Refine the scaffold from actual observed rifle-specific parts;
          # strict validation is not allowed to accept a one-box placeholder.
          python3 ../img2three/author_lime_rifle_spec.py \
            ../img2three/output/rifle-object-sculpt-spec.json \
            --out ../img2three/output/rifle-object-sculpt-spec.json
          # Extract independent PBR evidence from the user-owned original.
          # If the quality threshold rejects it, leave it rejected and report.
          python3 forge/stage1_intake/extract_pbr_evidence.py \
            ../img2three/viewer/public/ref/rifle.webp \
            --out-dir ../img2three/output/rifle-reference-pbr \
            --size 512 --material-id lime-coat \
            --spec ../img2three/output/rifle-object-sculpt-spec.json --in-place \
            --report ../img2three/output/rifle-reference-pbr-report.json \
            > ../img2three/output/rifle-reference-pbr-extractor.log 2>&1 || true
          set +e
          python3 forge/stage2_spec/validate_sculpt_spec.py \
            ../img2three/output/rifle-object-sculpt-spec.json --strict-quality --json \
            > ../img2three/output/rifle-strict-validation.json
          rifle_status=$?
          set -e
          if [ "$rifle_status" -eq 0 ]; then
            python3 forge/stage3_build/generate_threejs_factory.py \
              ../img2three/output/rifle-object-sculpt-spec.json --force \
              --out ../img2three/output/createRifleModel.ts \
              --blocked-report ../img2three/output/rifle-generator-blocked.json
            echo "Rifle strict quality: PASS; official factory generated." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 forge/stage3_build/generate_threejs_factory.py \
              ../img2three/output/rifle-object-sculpt-spec.json --force \
              --out ../img2three/output/createRifleModel.ts \
              --blocked-report ../img2three/output/rifle-generator-blocked.json || test "$?" -eq 2
            echo "Rifle strict quality: BLOCKED; automatic starter spec is NOT a finished production model." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "The master reference remains the user original; synthetic views have lower authority." >> "$GITHUB_STEP_SUMMARY"
      - name: Build Three.js viewer against generated original source
        run: |
          mkdir -p img2three/viewer/src/generated
          cp img2three/output/createTowerModel.ts img2three/viewer/src/generated/createTowerModel.ts
          npm --prefix img2three/viewer install --no-audit --no-fund
          npm --prefix img2three/viewer run build
          test -f img2three/viewer/dist/index.html
          echo "Vite compiled imported Three.js factory successfully." >> "$GITHUB_STEP_SUMMARY"
      - name: Automated WebGL preview screenshots for all five 3D models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img2three/preview /tmp/webgl-test
          npm --prefix /tmp/webgl-test install --no-audit --no-fund playwright
          node /tmp/webgl-test/node_modules/playwright/cli.js install --with-deps chromium
          npm --prefix img2three/viewer run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ -o /dev/null && break || sleep 1; done
          node <<'NODE'
          const {chromium}=require('/tmp/webgl-test/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1180,height:850},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction('window.__threeReady===true || !!window.__threeError',null,{timeout:60000});
            const report=[];
            for (const id of ['tower','compact','purple','rifle','tree']) {
              if(id!=='tower')await page.evaluate(id=>window.__chooseAsset(id),id);
              await page.waitForFunction(id=>window.__activeModel===id && window.__firstRenderComplete===true,id,{timeout:60000});
              await page.waitForTimeout(id==='tree'?1100:600);
              const v=await page.evaluate(()=>({ready:window.__threeReady,error:window.__threeError,stats:window.__threeStats}));
              await page.evaluate(()=>{document.querySelector('.ui').style.visibility='hidden';document.querySelector('.bottomhint').style.visibility='hidden'});
              await page.screenshot({path:'img2three/preview/'+id+'-front.png',timeout:90000});
              await page.evaluate(()=>window.__setPreviewView('angle'));
              await page.waitForTimeout(350);
              await page.screenshot({path:'img2three/preview/'+id+'-threequarter.png',timeout:90000});
              if(id==='rifle'){
                const angles=[
                  ['left','front'],['muzzle','side'],['right','back'],
                  ['brace','butt'],['top','top'],['bottom','bottom']
                ];
                for(const [label,view] of angles){
                  await page.evaluate(view=>window.__setPreviewView(view),view);
                  await page.waitForTimeout(400);
                  await page.screenshot({path:'img2three/preview/rifle-'+label+'-verification.png',timeout:90000});
                }
              }
              await page.evaluate(()=>{window.__setPreviewView('front');document.querySelector('.ui').style.visibility='visible';document.querySelector('.bottomhint').style.visibility='visible'});
              report.push({id,...v});
              console.log(JSON.stringify({id,stats:v.stats,error:v.error}));
              if(!v.ready || v.error)throw Error('Model '+id+' failed to render: '+v.error);
            }
            if(errors.length)throw Error('Browser exceptions: '+errors.join('; '));
            await browser.close();
            require('fs').writeFileSync('img2three/preview/gallery-report.json',JSON.stringify(report,null,2));
            console.log('PASS: WebGL 5/5; 16 screenshots captured including six rifle orthogonal checks');
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Upload input and pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img2threejs-original-run
          path: |
            img2three/output/
            img2three/reference_tower.jpg
            img2three/rifle-superprompt.md
            img2three/input/lime-rifle-auxiliary-views.json
            img2three/input/rifle-aux-*.webp
            img2three/viewer/public/ref/rifle.webp
            img2three/preview/
          if-no-files-found: warn
      - name: Publish verified rifle multiview images on isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for view in left muzzle right brace top bottom; do
            test -s "img2three/preview/rifle-${view}-verification.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img2three/preview/rifle-*-verification.png img2three/preview/gallery-report.json
          if git diff --cached --quiet; then
            echo "Rifle six-angle screenshots unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "gallery: publish verified six-angle Three.js rifle screenshots"
            # Generated assessment/spec files are intentionally uploaded as artifacts,
            # not preserved as unstaged changes in this ephemeral checkout.
            git reset --hard HEAD
            git pull --rebase origin img2threejs-runner
            git push origin HEAD:img2threejs-runner
            echo "Rifle six WebGL screenshot views committed to img2three/preview." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Generated factory output remains in the repository; the separate gallery
      # workflow publishes the bundle. This job validates WebGL and uploads
      # screenshots as artifacts, preventing duplicate concurrent Git pushes.
