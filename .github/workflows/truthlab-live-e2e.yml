# Full-system test in disposable GitHub runner. No production DB or secrets.
name: TruthLab Live End-to-End
on:
  push:
    branches: [main]
    paths: ['.github/workflows/truthlab-live-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlab-live-e2e
  cancel-in-progress: false

jobs:
  real-model-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: truthlab_e2e
          POSTGRES_USER: truthlab
          POSTGRES_PASSWORD: ci_only_not_a_production_credential
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U truthlab -d truthlab_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRUTHLAB_DATABASE_URL: postgresql://truthlab:ci_only_not_a_production_credential@127.0.0.1:5432/truthlab_e2e?sslmode=disable
      TRUTHLAB_TEST_DATABASE_URL: postgresql://truthlab:ci_only_not_a_production_credential@127.0.0.1:5432/truthlab_e2e?sslmode=disable
      OPENAI_API_KEY: local-only-no-external-key
      OPENAI_MODEL: qwen-local
      OPENAI_BASE_URL: http://127.0.0.1:8080/v1
      TRUTHLAB_MAX_MODEL_CALLS_DAY: "12"
    steps:
      - name: Checkout isolated TruthLab source
        uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: python -m pip install -r truthlab-live/requirements.txt
      - name: Cache verified open weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-0.5b-q4km-sha74a4da8
      - name: Start actual Qwen model via llama.cpp
        run: bash truthlab-live/start-local-llama.sh
      - name: Exercise real model, database, restart, two-agent pause, scheduler
        run: python truthlab-live/e2e_live.py
