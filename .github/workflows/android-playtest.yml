name: Android RPG Playtest APK

on:
  push:
    branches: [android-playtest-rpg]
    paths: ['.github/workflows/android-playtest.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          command -v java
      - name: Install web dependencies
        run: npm ci
      - name: Restore verified CC0 urban assets
        id: cc0
        uses: actions/cache@v4
        with:
          path: |
            assets/urban-kits
            assets/roadforge
          key: ubuntu-urban-cc0-v3-${{ hashFiles('tools/fetch-urban-kits.py', 'tools/prepare-urban-lods.mjs') }}
      - name: Fetch urban assets when necessary
        if: steps.cc0.outputs.cache-hit != 'true'
        run: python tools/fetch-urban-kits.py
      - name: Test gameplay and scene catalog
        run: npm test
      - name: Build Three.js game
        run: npm run build
      - name: Package all Android playtest scenes
        run: python tools/package-android-playtest.py
      - name: Install Capacitor Android 6
        run: npm install --no-save --ignore-scripts @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Create Android project
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ai.sketchbook.rpgplaytestv2",
            "appName": "Sketchbook AI RPG v2",
            "webDir": "www",
            "server": {"androidScheme": "https"}
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature, target SDK and installable package
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 12
          unzip -t "$APK" | tail -n 1
          echo "SHA256 $(sha256sum "$APK")"
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sketchbook-ai-rpg-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save packaging diagnostics
        if: failure()
        run: |
          echo "Android APK build failed. Inspect action steps." > apk-build-diagnostic.txt
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build-diagnostics
          path: apk-build-diagnostic.txt
