# Schedules run from default branch; agent code stays on dedicated branch.
# Production memory comes from a private managed PostgreSQL database.
# The cron job can use either a manually configured GitHub secret OR a signed
# OIDC exchange with the existing Render console to avoid repository secrets.
name: TruthLab Autonomous Tick
on:
  push:
    branches: [main]
    paths: ['.github/workflows/truthlab-autonomous-tick.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthlab-autonomous-tick
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    env:
      TRUTHLAB_DATABASE_URL: ${{ secrets.TRUTHLAB_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.TRUTHLAB_LLM_API_KEY }}
      OPENAI_MODEL: ${{ vars.TRUTHLAB_LLM_MODEL }}
      OPENAI_BASE_URL: ${{ vars.TRUTHLAB_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      TRUTHLAB_MAX_MODEL_CALLS_DAY: ${{ vars.TRUTHLAB_MAX_MODEL_CALLS_DAY || '48' }}
    steps:
      - name: Checkout isolated agents code
        uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve private PostgreSQL credential
        id: verify
        shell: bash
        run: |
          if [[ -n "$TRUTHLAB_DATABASE_URL" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            set +e
            python truthlab-live/fetch_worker_database.py
            code=$?
            set -e
            case "$code" in
              0) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
              2) echo "::error::TruthLab BLOCKED: durable PostgreSQL unavailable; zero agent cycles executed."
                 {
                   echo "### TruthLab blocked — no agent cycle executed"
                   echo "The database credential is absent and the Render OIDC broker is unavailable."
                   echo "Restore Render billing and its PostgreSQL broker, or configure the existing TRUTHLAB_DATABASE_URL Actions secret."
                   echo "This is an infrastructure failure, not a successful conversation run."
                 } >> "$GITHUB_STEP_SUMMARY"
                 exit 1 ;;
              *) echo "::error::GitHub/Render OIDC credential exchange failed."
                 exit "$code" ;;
            esac
          fi
      - name: Install PostgreSQL driver
        if: steps.verify.outputs.enabled == 'true'
        run: python -m pip install -r truthlab-live/requirements.txt
      - name: Check if an agent cycle is actually due
        id: due
        if: steps.verify.outputs.enabled == 'true'
        shell: bash
        run: |
          STATUS="$(python truthlab-live/app.py --is-due)"
          if [[ "$STATUS" == "due" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TruthLab paused or next cycle not due; model download skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select self-hosted open model when no external LLM is configured
        if: steps.due.outputs.ready == 'true'
        id: local
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" || -z "$OPENAI_MODEL" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY=local-only-no-external-key" >> "$GITHUB_ENV"
            echo "OPENAI_MODEL=qwen-local" >> "$GITHUB_ENV"
            echo "OPENAI_BASE_URL=http://127.0.0.1:8080/v1" >> "$GITHUB_ENV"
            echo "TRUTHLAB_MAX_MODEL_CALLS_DAY=96" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache open weights
        if: steps.local.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-1.5b-q4km-sha6a1a2eb6
      - name: Launch local Qwen llama.cpp
        if: steps.local.outputs.enabled == 'true'
        run: bash truthlab-live/start-local-llama.sh
      - name: Execute one due cycle
        if: steps.due.outputs.ready == 'true'
        run: python truthlab-live/app.py --once

  # One-off verification using a genuine GitHub-signed OIDC token;
  # cannot read database credentials during push events.
  oidc-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify GitHub OIDC identity is accepted by Render without returning secrets
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          address=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          address+=("&" if "?" in address else "?")
          address+=urllib.parse.urlencode({"audience":"truthlab-render-database-v1"})
          req=urllib.request.Request(address,headers={
              "Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              "Accept":"application/json; api-version=2.0"})
          with urllib.request.urlopen(req,timeout=20) as r:
              signed=json.load(r)["value"]
          req=urllib.request.Request(
              "https://truthlab-agents-open.onrender.com/api/worker/probe",
              headers={"Authorization":"Bearer "+signed})
          with urllib.request.urlopen(req,timeout=120) as r:
              result=json.load(r)
          assert result == {"verified":True,"credential_access":False}, "Unexpected OIDC probe result"
          print("TRUTHLAB_OIDC_VERIFIED signed main-branch workflow identity; zero credentials returned")
          PY

  # Runs only when THIS workflow definition changes: verifies actual inference,
  # not just syntax. No production DB or user transcripts accessed.
  free-model-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - name: Cache open weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-1.5b-q4km-sha6a1a2eb6
      - name: Launch local Qwen llama.cpp
        run: bash truthlab-live/start-local-llama.sh
      - name: Verify actual no-key LLM response
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          data = json.dumps({
            "model":"qwen-local",
            "messages":[{"role":"user","content":"Say the single word READY."}],
            "max_tokens":24,"temperature":0
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",data=data,
              headers={"Content-Type":"application/json","Authorization":"Bearer local-only"},
              method="POST")
          with urllib.request.urlopen(req,timeout=100) as response:
              parsed=json.load(response)
          content=parsed["choices"][0]["message"]["content"]
          assert isinstance(content,str) and content.strip(), "Empty generated response"
          print("TRUTHLAB_FREE_LLM_SUCCESS: local response generated (content not persisted)")
          PY
