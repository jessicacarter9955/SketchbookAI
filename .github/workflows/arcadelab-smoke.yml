name: ArcadeLab Browser Smoke
on:
  push:
    branches: [arcadelab-incremental-preview]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Economy test and static build
        run: |
          cd arcadelab
          npm test
          npm run build
      - name: Install Playwright chromium
        run: |
          cd arcadelab
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start site and test browser
        run: |
          python3 -m http.server 4173 --directory arcadelab/dist &
          sleep 3
          node arcadelab/tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcadelab-desktop-mobile-screenshots
          path: screenshot-*.png