name: Urban branch CI + screenshot

on:
  push:
    branches: [ "urban-procedural-vehicles" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start editor
        run: |
          npx webpack serve --config webpack.dev.js --host 127.0.0.1 --port 8401 > /tmp/sketchbook-editor.log 2>&1 &
          echo $! > /tmp/sketchbook-editor.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8401/editor.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sketchbook-editor.log
          exit 1
      - name: Capture procedural city
        run: |
          mkdir -p artifacts
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,900" --wait-for-timeout 15000             "http://127.0.0.1:8401/editor.html?scene=urban-procedural" artifacts/urban-editor.png
      - name: Save editor log
        if: always()
        run: cp /tmp/sketchbook-editor.log artifacts/editor-server.log || true
      - name: Upload visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-visual-verification
          path: artifacts
