name: Record real Urban Photoreal supercars driving videos
on:
  push:
    branches: [codex/sa-navigation-port]
    paths:
      - ".github/workflows/record-urban-supercars.yml"
      - "tools/record-urban-supercars.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium and verify ffmpeg
        run: |
          npm install --prefix /tmp/photoreal-recording --no-save --no-audit --no-fund playwright@1.56.0
          /tmp/photoreal-recording/node_modules/.bin/playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Film BMW Ferrari and Lamborghini driven in the real Three.js city
        env:
          NODE_PATH: /tmp/photoreal-recording/node_modules
          PHOTO_URL: https://6ad259ad86251ebad353dc0c--my-test-site3.netlify.app/editor.html?scene=urban-photoreal&cityBlocks=2&play=1
          DRIVE_MS: '7000'
        run: node tools/record-urban-supercars.cjs
      - name: Verify images and MP4 outputs
        if: success()
        run: |
          set -euo pipefail
          for car in bmw ferrari lamborghini; do
            test -s "artifacts/urban-supercar-driving/$car.png"
            test -s "artifacts/urban-supercar-driving/$car.mp4"
            ffprobe -v error -show_entries format=duration -of default=nw=1 "artifacts/urban-supercar-driving/$car.mp4"
          done
          test -s "artifacts/urban-supercar-driving/urban-photoreal-overview.png"
          node -e 'const j=require("./artifacts/urban-supercar-driving/results.json");if(!j.ok||j.cars.length!==3||j.cars.some(x=>x.driveDistanceMeters<0.4))process.exit(1);'
          echo "Three genuine Sketchfab driving recordings and photos verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 3 individual videos and photos for viewing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-photoreal-bmw-ferrari-lamborghini-driving
          path: |
            artifacts/urban-supercar-driving/*.mp4
            artifacts/urban-supercar-driving/*.png
            artifacts/urban-supercar-driving/results.json
          if-no-files-found: warn
          retention-days: 14
