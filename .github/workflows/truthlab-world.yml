name: TruthLab World Interface — private R2 and supervised X
on:
  schedule:
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: "Real-world worker operation"
        required: true
        type: choice
        options: [status, research, feedback, enable, pause, approve-publish]
        default: status
      draft_id:
        description: "Exact immutable 24-character draft identifier, for approve-publish only"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: truthlab-world-private-r2-writer
  cancel-in-progress: false
jobs:
  world-interface:
    name: Real agent tools and shared private memory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truthlab-autonomous-agents
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real R2 SDK
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate private storage configuration (no false-green)
        shell: bash
        env:
          TRUTHLAB_R2_ENDPOINT: ${{ secrets.TRUTHLAB_R2_ENDPOINT }}
          TRUTHLAB_R2_BUCKET: ${{ secrets.TRUTHLAB_R2_BUCKET }}
          TRUTHLAB_R2_ACCESS_KEY_ID: ${{ secrets.TRUTHLAB_R2_ACCESS_KEY_ID }}
          TRUTHLAB_R2_SECRET_ACCESS_KEY: ${{ secrets.TRUTHLAB_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$TRUTHLAB_R2_ENDPOINT" || -z "$TRUTHLAB_R2_BUCKET" || -z "$TRUTHLAB_R2_ACCESS_KEY_ID" || -z "$TRUTHLAB_R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Private R2 secrets are required; there is no durable shared worker backend yet."
            exit 1
          fi
      - name: Cache real Qwen CPU weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/truthlab-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: truthlab-qwen2.5-1.5b-q4km-sha6a1a2eb6
      - name: Start local Qwen for actual autonomous research
        if: github.event_name == 'schedule' || inputs.action == 'research'
        env:
          REMOTE_MODEL_KEY: ${{ secrets.TRUTHLAB_WORLD_MODEL_API_KEY }}
          REMOTE_MODEL_BASE: ${{ vars.TRUTHLAB_WORLD_MODEL_URL }}
          REMOTE_MODEL_NAME: ${{ vars.TRUTHLAB_WORLD_MODEL_NAME }}
        shell: bash
        run: |
          if [[ -z "$REMOTE_MODEL_KEY" ]]; then
            bash truthlab-live/start-local-llama.sh
            echo 'OPENAI_BASE_URL=http://127.0.0.1:8080/v1' >> "$GITHUB_ENV"
            echo 'OPENAI_MODEL=qwen-local' >> "$GITHUB_ENV"
            echo 'OPENAI_API_KEY=local-only-no-external-key' >> "$GITHUB_ENV"
            echo 'TRUTHLAB_MODEL=real local Qwen2.5-1.5B-Instruct' >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ -z "$REMOTE_MODEL_BASE" || -z "$REMOTE_MODEL_NAME" ]]; then
              echo "::error::Remote model key exists, but URL/model name is missing"
              exit 1
            fi
            echo "OPENAI_BASE_URL=$REMOTE_MODEL_BASE" >> "$GITHUB_ENV"
            echo "OPENAI_MODEL=$REMOTE_MODEL_NAME" >> "$GITHUB_ENV"
            echo "OPENAI_API_KEY=$REMOTE_MODEL_KEY" >> "$GITHUB_ENV"
          fi
      - name: Execute real operation with strict operator authorization
        shell: bash
        env:
          TRUTHLAB_R2_ENDPOINT: ${{ secrets.TRUTHLAB_R2_ENDPOINT }}
          TRUTHLAB_R2_BUCKET: ${{ secrets.TRUTHLAB_R2_BUCKET }}
          TRUTHLAB_R2_ACCESS_KEY_ID: ${{ secrets.TRUTHLAB_R2_ACCESS_KEY_ID }}
          TRUTHLAB_R2_SECRET_ACCESS_KEY: ${{ secrets.TRUTHLAB_R2_SECRET_ACCESS_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TRUTHLAB_X_USER_ACCESS_TOKEN: ${{ secrets.TRUTHLAB_X_USER_ACCESS_TOKEN }}
          TRUTHLAB_APPROVER_GITHUB_LOGIN: 'jessicacarter9955'
          ACTION: ${{ inputs.action }}
          DRAFT_ID: ${{ inputs.draft_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            ACTION=research
          fi
          if [[ -z "$ACTION" ]]; then
            ACTION=status
          fi
          case "$ACTION" in
            approve-publish|enable|pause)
              if [[ "$EVENT_NAME" != "workflow_dispatch" || "$GITHUB_ACTOR" != "jessicacarter9955" ]]; then
                echo "::error::Human operator approval required; scheduling cannot publish or activate agents."
                exit 1
              fi
              ;;
          esac
          if [[ "$ACTION" == "approve-publish" ]]; then
            if [[ ! "$DRAFT_ID" =~ ^[0-9a-f]{24}$ ]]; then
              echo "::error::A specific existing immutable draft ID is required."
              exit 1
            fi
            python -u truthlab-live/world_interface.py approve-publish --draft-id "$DRAFT_ID"
          else
            python -u truthlab-live/world_interface.py "$ACTION"
          fi
