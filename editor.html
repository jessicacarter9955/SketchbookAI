<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sketchbook · World Editor</title>
    <link rel="stylesheet" href="src/editor/editor.css">
    <link rel="stylesheet" href="src/editor/city-telemetry.css">
</head>
<body class="editor-page">
    <div id="loading-screen" role="status" aria-live="polite">
        <section class="city-loading-panel">
          <h1>Sketchbook City Player</h1>
          <p id="city-load-message">Preparazione della città…</p>
          <progress id="city-load-progress" max="7" value="0" aria-label="Caricamento dettagli città"></progress>
          <p id="city-load-counter">0 di 7 fasi HD completate</p>
          <p class="city-load-note">La città HD viene preparata e salvata in cache: agli accessi successivi gli asset e le facciate già assemblate possono essere recuperati dal disco.</p>
          <div class="city-load-actions">
            <button id="city-load-retry" type="button" onclick="location.reload()" hidden>Riprova</button>
          </div>
        </section>
    </div>
    <div id="ui-container"><div id="controls"></div></div>
    <div id="statsBox" hidden></div><div id="dat-gui-container" hidden></div>
    <script src="src/editor/city-telemetry.js"></script>
    <script src="src/editor/city-perf.js"></script>
    <script src="build/sketchbook.min.js"></script>
    <script src="src/editor/sketchfab-client.js"></script>
    <script src="src/editor/fab-client.js"></script>
    <script src="3dPicker.js"></script>
    <script src="src/editor/fab-picker.js"></script>
    <script type="module" src="src/editor/start.js"></script>
</body>
</html>
